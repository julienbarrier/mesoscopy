name: build doc

# Every push builds the documentation (a broken reference or a missing image fails the build, so it is caught on the branch);
# a push to main also publishes it, by replacing the content of the `docs` branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # the push below uses the DOC_TOKEN, not the token of the workflow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs_requirements.txt

      - name: Install the requirements of the documentation
        run: |
          python -m pip install --upgrade pip
          pip install -r docs_requirements.txt

      - name: Build the documentation
        # -W: a warning is an error; --keep-going: report all of them at once
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 14

      - name: Publish to the docs branch
        if: github.ref == 'refs/heads/main'
        env:
          DOC_TOKEN: ${{ secrets.DOC_TOKEN }}
        run: |
          cd docs/_build/html
          touch .nojekyll # GitHub Pages must not process the files with Jekyll
          git init --initial-branch=docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "build doc"
          git push --force "https://x-access-token:${DOC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" docs
