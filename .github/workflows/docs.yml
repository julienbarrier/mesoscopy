name: build doc

# Every push builds the documentation. The screenshots are made again from the program itself (docs/make_screenshots.py), so
# they always show the version being documented. A broken reference or a missing image fails the build; a push to main
# also publishes the pages, by replacing the content of the `docs` branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the token of the workflow replace the docs branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen # the screenshots are drawn by Qt into memory: no display is needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Libraries Qt needs on a machine without a screen
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            docs_requirements.txt
            setup.py

      - name: Install the program and the requirements of the documentation
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r docs_requirements.txt

      - name: Make the screenshots from the program
        run: python docs/make_screenshots.py

      - name: Build the documentation
        # -W: a warning is an error; --keep-going: report all of them at once
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 14

      - name: Publish to the docs branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # the token the workflow gets from GitHub for this run: no password and no personal access token (DOC_TOKEN)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: docs/_build/html
          force_orphan: true # the docs branch holds one commit: the built pages
          commit_message: build doc
