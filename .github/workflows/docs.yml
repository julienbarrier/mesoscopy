name: build doc

# Every push builds the documentation (a broken reference or a missing image fails the build, so it is caught on the branch);
# a push to main also publishes it, by replacing the content of the `docs` branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the token of the workflow replace the docs branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs_requirements.txt

      - name: Install the requirements of the documentation
        run: |
          python -m pip install --upgrade pip
          pip install -r docs_requirements.txt

      - name: Build the documentation
        # -W: a warning is an error; --keep-going: report all of them at once
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 14

      - name: Publish to the docs branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # the token the workflow gets from GitHub for this run: no password and no personal access token (DOC_TOKEN)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: docs/_build/html
          force_orphan: true # the docs branch holds one commit: the built pages
          commit_message: build doc
