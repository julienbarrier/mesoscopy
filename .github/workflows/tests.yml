name: tests

# The test suite (tests/): unit tests of the core, the live data of a run, and the application itself, tab by tab, run without
# a screen on the simulated instruments of docs/_static/dummy.station.yaml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen # Qt draws into memory: no display is needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Libraries Qt needs on a machine without a screen
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install the program and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run the tests
        run: pytest --durations=10
